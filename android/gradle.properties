# إعدادات ذاكرة Java والتخلص من تحذيرات النظام في Java 21+
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -Dfile.encoding=UTF-8 --enable-native-access=ALL-UNNAMED

# إعدادات دعم المكتبات الحديثة
android.useAndroidX=true

# خيارات التوافقية الخاصة بقوالب Flutter الحديثة
android.newDsl=false
android.builtInKotlin=false
